spring:
  application:
    name: backoffice-app

  datasource:
    username: postgres
    password: postgres
    url: jdbc:postgresql://db:5432/postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
